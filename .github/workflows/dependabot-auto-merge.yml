name: Dependabot auto-merge
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      contains(github.event.workflow_run.head_branch, 'minor-patch')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the matching dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName \
            | jq -r --arg branch "$HEAD_BRANCH" '.[] | select(.headRefName == $branch) | .number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --rebase --delete-branch
          fi
